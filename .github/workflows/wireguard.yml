name: StreamVault VPN APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wireguard.yml
      - bootstrap/streamvault-v1.2.6-wireguard.patch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamvault-vpn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare StreamVault 1.2.6 with WireGuard
        shell: bash
        run: |
          upstream_commit=6279060d20c8d1305f05da2957a5605885e4ccbf
          source_dir="$RUNNER_TEMP/streamvault-source"
          git init "$source_dir"
          git -C "$source_dir" fetch --depth=1 --no-tags https://github.com/Davidona/StreamVault-IPTV.git refs/tags/v1.2.6
          test "$(git -C "$source_dir" rev-parse 'FETCH_HEAD^{commit}')" = "$upstream_commit"
          git -C "$source_dir" checkout --detach "$upstream_commit"
          git -C "$source_dir" apply --index "$GITHUB_WORKSPACE/bootstrap/streamvault-v1.2.6-wireguard.patch"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify the runner Android SDK
        shell: bash
        run: |
          test -f "${ANDROID_HOME:?}/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Test WireGuard configuration and build APK
        shell: bash
        working-directory: ${{ runner.temp }}/streamvault-source
        run: |
          node scripts/test-wireguard-phone.cjs
          ./gradlew --no-daemon --console=plain --no-parallel --max-workers=2 \
            :app:testDebugUnitTest --tests 'com.streamvault.app.vpn.*' :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/streamvault-source/app/build/outputs/apk/debug/app-debug.apk" dist/StreamVault-VPN-debug.apk
          (cd dist && sha256sum StreamVault-VPN-debug.apk > StreamVault-VPN-debug.apk.sha256)
          git rev-parse HEAD > dist/source-commit.txt
          git -C "$RUNNER_TEMP/streamvault-source" rev-parse HEAD > dist/upstream-commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: StreamVault-VPN-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WireGuard-test-reports
          path: ${{ runner.temp }}/streamvault-source/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
